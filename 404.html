  <style>
    :root {
      --bg: #04050a; --text-1: #eef2f9; --text-2: #a9b3c6; --text-3: #6c7689;
      --accent: #5e8fff; --accent-2: #38d6ff; --accent-glow: rgba(94,143,255,.35);

      --font-display: "Space Grotesk", "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "Cutive Mono", Consolas, monospace;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      overflow: hidden; text-align: center;
      position: relative;
    }
    /* ambient glows */
    body::before, body::after {
      content: ""; position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none;
    }
    body::before { width: 520px; height: 520px; left: -140px; top: -160px; background: rgba(94,143,255,.16); }

      background: linear-gradient(180deg, #fff 0%, #b9c6e8 50%, #5e8fff 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 80px var(--accent-glow);
      animation: float 5s var(--ease-expo) infinite alternate;
    }
    @keyframes float { from { transform: translateY(-8px); } to { transform: translateY(10px); } }
    .tag { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .34em; color: var(--accent); margin: 26px 0 14px; }
    h1 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 500; margin-bottom: 10px; }
    p { color: var(--text-2); font-size: .95rem; max-width: 420px; margin: 0 auto 34px; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 30px; border-radius: 999px;
      background: linear-gradient(120deg, #8fb0ff, #5e8fff 45%, #38d6ff);
      color: #05060b; font-weight: 600; text-decoration: none;
      font-family: var(--font-display); font-size: .95rem;
      box-shadow: 0 12px 38px -12px var(--accent-glow);
      transition: transform .45s var(--ease-expo), box-shadow .45s var(--ease-expo);
    }
    .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 50px -12px var(--accent-glow); }
    .mono-note { margin-top: 30px; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .18em; color: var(--text-3); }
    .mono-note a { color: var(--accent); text-decoration: none; }
    .mono-note a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { .code { animation: none; } }
